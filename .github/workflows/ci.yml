name: MLOps Agent CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-lint-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-api.txt
          pip install mlflow pytest ruff

      - name: Lint Python code
        run: |
          ruff check agent api dags training tests --select=E9,F63,F7,F82

      - name: Run automated tests
        run: |
          python -m pytest -q

      - name: Build Docker image
        run: |
          docker build -t mlops-agent-api:ci .
