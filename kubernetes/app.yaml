apiVersion: v1
kind: Namespace
metadata:
  name: mlops-agent
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: mlops-agent
data:
  APP_VERSION: "1.0.0"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlops-agent-api
  namespace: mlops-agent
  labels:
    app: mlops-agent-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mlops-agent-api
  template:
    metadata:
      labels:
        app: mlops-agent-api
    spec:
      containers:
        - name: api
          image: mlops-agent-api:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: APP_VERSION
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: APP_VERSION
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: mlops-agent-api
  namespace: mlops-agent
spec:
  type: ClusterIP
  selector:
    app: mlops-agent-api
  ports:
    - port: 80
      targetPort: 8000
      protocol: TCP
